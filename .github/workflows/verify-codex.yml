name: Verify Codex adapter

# Codex users consume this repository's rolling marketplace on main. Its
# artifact tag is an independent verification checkpoint, not a publication.
on:
  push:
    tags: ["codex-v*"]

permissions:
  actions: read
  contents: read

jobs:
  marketplace-verification:
    if: github.repository == 'hiback/tmux-agents-status'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/marketplace-verification.yml
    # Environment secrets resolve in a called workflow's environment-bound job
    # only when the caller inherits secrets (actions/runner#4453). The
    # repository and organization hold no secrets of their own.
    secrets: inherit
    with:
      artifact: codex
      sha: ${{ github.sha }}
