name: Release Codex adapter

# The Codex adapter is the plugin of this repository's Codex marketplace, so
# publication is a GitHub release on its own tag. The tag, environment, and
# gates are separate from every other artifact, so this release can neither
# block nor be blocked by another adapter or the core.
on:
  push:
    tags: ["codex-v*"]

permissions:
  contents: read

jobs:
  # Three lanes of the full deterministic suite, which already contains every
  # adapter fixture and every package check.
  deterministic:
    # Forks carry neither the protected environment nor its credentials; the
    # guard keeps a fork's own tag from starting a publication attempt at all.
    if: github.repository == 'hiback/tmux-agents-status'
    uses: ./.github/workflows/ci.yml

  # Builds the marketplace tree exactly once. Both smoke lanes install this
  # upload, and publication verifies the tag still resolves to it, so nothing
  # that was tested can be rebuilt before it reaches users.
  stage:
    if: github.repository == 'hiback/tmux-agents-status'
    runs-on: ubuntu-latest
    outputs:
      marketplace: ${{ steps.trees.outputs.marketplace }}
      plugin: ${{ steps.trees.outputs.plugin }}
      hooks: ${{ steps.digests.outputs.hooks }}
      hook: ${{ steps.digests.outputs.hook }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify the tag matches the plugin manifest
        run: |
          version=$(node -p "require('./packages/codex/.codex-plugin/plugin.json').version")
          [ "$GITHUB_REF_NAME" = "codex-v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          }

      # A marketplace added as `hiback/tmux-agents-status` resolves the default
      # branch, so a tag off it would release contents no user can install.
      - name: Verify the tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || {
            echo "$GITHUB_REF_NAME is not on $DEFAULT_BRANCH" >&2
            exit 1
          }

      # `git archive` preserves the hook's executable bit, which a plain
      # directory upload would drop.
      - name: Build the marketplace artifact
        run: |
          mkdir -p "$RUNNER_TEMP/staged"
          git archive --format=tar -o "$RUNNER_TEMP/staged/marketplace.tar" HEAD .agents/plugins packages/codex

      - name: Record the staged content ids
        id: trees
        run: |
          {
            echo "marketplace=$(git rev-parse 'HEAD:.agents/plugins')"
            echo "plugin=$(git rev-parse 'HEAD:packages/codex')"
          } >>"$GITHUB_OUTPUT"

      # The hook definition and its digests, recorded in the release's own log.
      # The digests travel to the smoke lanes, which compare them against what
      # Codex actually installed and refuse to trust anything else.
      - name: Record the hook definition
        id: digests
        run: |
          hooks=$(sha256sum packages/codex/hooks/hooks.json | cut -d' ' -f1)
          hook=$(sha256sum packages/codex/bin/tmux-agents-status-hook | cut -d' ' -f1)
          cat packages/codex/hooks/hooks.json
          echo "hooks/hooks.json sha256: $hooks"
          echo "bin/tmux-agents-status-hook sha256: $hook"
          {
            echo "hooks=$hooks"
            echo "hook=$hook"
          } >>"$GITHUB_OUTPUT"

      # The immediate predecessor rather than the highest tag, so a patch
      # released onto an older line still updates from what its users have. An
      # empty result means a first release, which skips only the update case.
      - name: Stage the previous public version
        id: previous
        run: |
          tag=$(git tag --list 'codex-v*' --sort=v:refname |
            awk -v cur="$GITHUB_REF_NAME" '$0 == cur { print prev; found = 1; exit } { prev = $0 } END { exit !found }')
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          [ -n "$tag" ] || exit 0
          git archive --format=tar -o "$RUNNER_TEMP/staged/previous.tar" "$tag" .agents/plugins packages/codex

      - uses: actions/upload-artifact@v4
        with:
          name: staged-codex
          path: ${{ runner.temp }}/staged/*.tar
          retention-days: 7

  # Credentialed real-agent lanes. They add the staged marketplace through
  # Codex's own command, install the plugin, launch Codex directly in a real
  # tmux pane, answer Codex's own hook review, and inspect plugin-owned tmux
  # metadata only. Nothing here bypasses hook trust: the lanes prove the install
  # trusts nothing, that an untrusted adapter stays inert, and that Codex's own
  # review is what activates it, against the exact definition `stage` recorded.
  smoke:
    needs: [deterministic, stage]
    runs-on: ${{ matrix.os }}
    environment: codex-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-tmux
        with:
          version: current

      - name: Install the agent
        run: npm install --global @openai/codex

      - uses: actions/download-artifact@v4
        with:
          name: staged-codex
          path: ${{ runner.temp }}/staged

      - name: Unpack the staged artifact
        env:
          # One lane exercises the native update path; a first release has no
          # previous public version to update from.
          PREVIOUS: ${{ matrix.os == 'ubuntu-latest' && needs.stage.outputs.previous || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/staged/marketplace"
          tar -xf "$RUNNER_TEMP/staged/marketplace.tar" -C "$RUNNER_TEMP/staged/marketplace"
          [ -z "$PREVIOUS" ] || {
            mkdir -p "$RUNNER_TEMP/staged/previous"
            tar -xf "$RUNNER_TEMP/staged/previous.tar" -C "$RUNNER_TEMP/staged/previous"
            echo "PREVIOUS_DIR=$RUNNER_TEMP/staged/previous" >>"$GITHUB_ENV"
          }

      - name: Smoke the staged artifact through the real agent
        env:
          TAS_CODEX_HOOKS_SHA256: ${{ needs.stage.outputs.hooks }}
          TAS_CODEX_HOOK_SHA256: ${{ needs.stage.outputs.hook }}
          TAS_SMOKE_MODEL: gpt-5.6-luna
          OPENAI_API_KEY: ${{ secrets.SMOKE_OPENAI_API_KEY }}
        run: |
          tmux -V
          ./test/smoke-codex.sh "$RUNNER_TEMP/staged/marketplace" "${PREVIOUS_DIR-}"

  # Publishes the tag the lanes tested, after proving it still resolves to the
  # staged marketplace contents.
  publish:
    needs: [stage, smoke]
    runs-on: ubuntu-latest
    environment: codex-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify the tag still resolves to the staged contents
        env:
          MARKETPLACE: ${{ needs.stage.outputs.marketplace }}
          PLUGIN: ${{ needs.stage.outputs.plugin }}
        run: |
          [ "$(git rev-parse 'HEAD:.agents/plugins')" = "$MARKETPLACE" ] &&
            [ "$(git rev-parse 'HEAD:packages/codex')" = "$PLUGIN" ] || {
            echo "$GITHUB_REF_NAME no longer resolves to the smoke tested contents" >&2
            exit 1
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
