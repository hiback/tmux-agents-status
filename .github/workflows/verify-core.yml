name: Verify core checkpoint

# Core is distributed from main. Its tag workflow records a stable checkpoint
# only after the exact commit has passed the default branch's deterministic CI.
on:
  push:
    tags: ["core-v*"]

permissions:
  actions: read
  contents: read

jobs:
  verify-tag:
    if: github.repository == 'hiback/tmux-agents-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify the Core checkpoint tag
        run: node scripts/release-policy.mjs check-artifact --artifact core --tag "$GITHUB_REF_NAME" --head "$GITHUB_SHA"

      - name: Verify the tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "$GITHUB_REF_NAME is not on $DEFAULT_BRANCH" >&2
            exit 1
          }

  main-ci-proof:
    needs: verify-tag
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-proof.yml
    with:
      sha: ${{ github.sha }}
