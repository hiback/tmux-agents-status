name: Release OpenCode npm adapter

on:
  push:
    tags: ["opencode-v*"]

# The proof reads Actions evidence; the called publication workflow narrows the
# OIDC grant to its npm publish job.
permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  main-ci-proof:
    if: github.repository == 'hiback/tmux-agents-status'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-proof.yml
    with:
      sha: ${{ github.sha }}

  release:
    needs: main-ci-proof
    uses: ./.github/workflows/release-npm-adapter.yml
    with:
      sha: ${{ github.sha }}
      adapter: opencode
      package: tmux-agents-status-opencode
      environment: opencode-release
      agent: opencode-ai
      model: openai/gpt-5.6-luna
    secrets: inherit
