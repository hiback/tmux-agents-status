name: Release OpenCode adapter

on:
  push:
    tags: ["opencode-v*"]

# The called workflow cannot hold a token stronger than this one, so the
# registry's OIDC scope has to be granted here for its publish job to narrow.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    # Forks carry neither the protected environment nor its credentials; the
    # guard keeps a fork's own tag from starting a publication attempt at all.
    if: github.repository == 'hiback/tmux-agents-status'
    uses: ./.github/workflows/release-npm-adapter.yml
    with:
      adapter: opencode
      package: tmux-agents-status-opencode
      environment: opencode-release
      agent: opencode-ai
      model: openai/gpt-5.6-luna
    secrets: inherit
