name: Release npm adapter

# Pi and OpenCode enter this path only after their caller has reused successful
# main CI evidence for the exact tagged commit. Each caller supplies fixed
# artifact metadata and an independent protected environment.
on:
  workflow_call:
    inputs:
      sha:
        description: Tagged commit already authorized by exact-SHA main CI proof
        required: true
        type: string
      adapter:
        description: Workspace directory under packages/
        required: true
        type: string
      package:
        description: Published npm package name
        required: true
        type: string
      environment:
        description: Protected environment holding this adapter's credentials
        required: true
        type: string
      agent:
        description: npm package providing the current stable agent CLI
        required: true
        type: string
      model:
        description: provider/model used by the smoke turns
        required: true
        type: string
    # Credential inputs are deliberately absent. Jobs resolve the provider key
    # and any temporary NPM_TOKEN only from the selected artifact environment.

permissions:
  contents: read

jobs:
  # Pack exactly once and record npm's registry-compatible integrity for those
  # bytes. Every smoke and publication decision consumes this upload.
  stage:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
      candidate: ${{ steps.policy.outputs.candidate }}
      previous: ${{ steps.policy.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify the tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAGGED_SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$TAGGED_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "$GITHUB_REF_NAME is not on $DEFAULT_BRANCH" >&2
            exit 1
          }

      - name: Verify the candidate against tag and registry history
        id: policy
        env:
          ADAPTER: ${{ inputs.adapter }}
          PACKAGE: ${{ inputs.package }}
          TAGGED_SHA: ${{ inputs.sha }}
        run: |
          registry_versions=$RUNNER_TEMP/registry-versions.json
          registry_errors=$RUNNER_TEMP/registry-errors.log
          if npm view "$PACKAGE" versions --json >"$registry_versions" 2>"$registry_errors"; then
            :
          elif grep -Eiq '(^|[^[:alnum:]_])E404([^[:alnum:]_]|$)' \
            "$registry_versions" "$registry_errors"; then
            printf '[]\n' >"$registry_versions"
          else
            cat "$registry_versions" >&2
            cat "$registry_errors" >&2
            exit 1
          fi

          result=$(node scripts/release-policy.mjs check-artifact \
            --artifact "$ADAPTER" \
            --tag "$GITHUB_REF_NAME" \
            --head "$TAGGED_SHA" \
            --registry-versions "$registry_versions")
          printf '%s\n' "$result"
          printf '%s\n' "$result" >>"$GITHUB_OUTPUT"

      - name: Pack the candidate once
        id: pack
        env:
          ADAPTER: ${{ inputs.adapter }}
          PACKAGE: ${{ inputs.package }}
          CANDIDATE: ${{ steps.policy.outputs.candidate }}
        run: |
          staged=$RUNNER_TEMP/staged
          mkdir -p "$staged"
          npm pack --json --workspace "packages/$ADAPTER" \
            --pack-destination "$staged" >"$RUNNER_TEMP/npm-pack.json"

          STAGED=$staged PACK_JSON=$RUNNER_TEMP/npm-pack.json \
            node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, readdirSync } from "node:fs";
          import { basename } from "node:path";

          const entries = JSON.parse(readFileSync(process.env.PACK_JSON, "utf8"));
          const tarballs = readdirSync(process.env.STAGED).filter((name) => name.endsWith(".tgz"));
          if (!Array.isArray(entries) || entries.length !== 1 || tarballs.length !== 1) {
            throw new Error("npm pack must produce exactly one candidate tarball");
          }
          const [entry] = entries;
          const [tarball] = tarballs;
          if (basename(entry.filename) !== tarball) {
            throw new Error("npm pack metadata does not identify the staged tarball");
          }
          if (entry.name !== process.env.PACKAGE || entry.version !== process.env.CANDIDATE) {
            throw new Error("npm pack metadata does not match the verified candidate");
          }
          if (typeof entry.integrity !== "string" ||
              !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(entry.integrity)) {
            throw new Error("npm pack did not report registry-compatible sha512 integrity");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `tarball=${tarball}\nintegrity=${entry.integrity}\n`,
          );
          console.log(`Staged ${entry.name}@${entry.version} as ${tarball} (${entry.integrity})`);
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: staged-${{ inputs.adapter }}
          path: ${{ runner.temp }}/staged/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

      # Publication needs the tested policy entrypoint but never a source
      # checkout from which it could accidentally rebuild the package.
      - uses: actions/upload-artifact@v7
        with:
          name: release-policy-${{ inputs.adapter }}
          path: scripts/release-policy.mjs
          if-no-files-found: error
          retention-days: 7

  # Both operating systems install the same verified tarball through the
  # current stable native agent. Linux alone receives the greatest published
  # version below the candidate for update coverage.
  smoke:
    needs: stage
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-tmux
        with:
          version: current

      - name: Install the current stable agent
        env:
          AGENT: ${{ inputs.agent }}
        run: npm install --global "$AGENT"

      - uses: actions/download-artifact@v8
        with:
          name: staged-${{ inputs.adapter }}
          path: ${{ runner.temp }}/staged

      - name: Verify and unpack the staged tarball
        env:
          TARBALL_PATH: ${{ runner.temp }}/staged/${{ needs.stage.outputs.tarball }}
          EXPECTED_INTEGRITY: ${{ needs.stage.outputs.integrity }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";

          const actual = `sha512-${createHash("sha512")
            .update(readFileSync(process.env.TARBALL_PATH))
            .digest("base64")}`;
          if (actual !== process.env.EXPECTED_INTEGRITY) {
            throw new Error("downloaded tarball integrity differs from staging");
          }
          NODE
          tar -xzf "$TARBALL_PATH" -C "$RUNNER_TEMP/staged"

      - name: Smoke the staged artifact through the real agent
        env:
          ADAPTER: ${{ inputs.adapter }}
          TAS_SMOKE_MODEL: ${{ inputs.model }}
          OPENAI_API_KEY: ${{ secrets.SMOKE_OPENAI_API_KEY }}
          PREVIOUS: ${{ matrix.os == 'ubuntu-latest' && needs.stage.outputs.previous || '' }}
        run: |
          [ -n "$OPENAI_API_KEY" ] || {
            echo "$ADAPTER release environment does not define SMOKE_OPENAI_API_KEY" >&2
            exit 1
          }
          tmux -V
          "./test/smoke-$ADAPTER.sh" "$RUNNER_TEMP/staged/package" "$PREVIOUS"

  # Query the exact registry version before publishing the same tarball. A
  # rerun is successful only when registry and staged integrity are identical.
  publish:
    needs: [stage, smoke]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: staged-${{ inputs.adapter }}
          path: ${{ runner.temp }}/staged

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ inputs.adapter }}
          path: ${{ runner.temp }}/release-policy

      - name: Verify the publication tarball
        env:
          TARBALL_PATH: ${{ runner.temp }}/staged/${{ needs.stage.outputs.tarball }}
          EXPECTED_INTEGRITY: ${{ needs.stage.outputs.integrity }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";

          const actual = `sha512-${createHash("sha512")
            .update(readFileSync(process.env.TARBALL_PATH))
            .digest("base64")}`;
          if (actual !== process.env.EXPECTED_INTEGRITY) {
            throw new Error("publication tarball integrity differs from staging");
          }
          NODE

      - name: Publish the absent candidate or accept an identical rerun
        env:
          PACKAGE: ${{ inputs.package }}
          CANDIDATE: ${{ needs.stage.outputs.candidate }}
          INTEGRITY: ${{ needs.stage.outputs.integrity }}
          TARBALL_PATH: ${{ runner.temp }}/staged/${{ needs.stage.outputs.tarball }}
          # Empty in steady state so npm uses the job's OIDC identity. A
          # deliberately provisioned environment token is the emergency path.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN-}" ]; then
            export NODE_AUTH_TOKEN=$NPM_TOKEN
          fi
          result=$(node "$RUNNER_TEMP/release-policy/release-policy.mjs" check-npm-artifact \
            --package "$PACKAGE" \
            --version "$CANDIDATE" \
            --integrity "$INTEGRITY")
          printf '%s\n' "$result"
          decision=$(printf '%s\n' "$result" | sed -n 's/^decision=//p')
          case "$decision" in
            publish)
              npm publish "$TARBALL_PATH" --access public
              ;;
            already-published)
              echo "$PACKAGE@$CANDIDATE already has the staged integrity; publication is complete"
              ;;
            *)
              echo "unexpected npm publication decision: $decision" >&2
              exit 1
              ;;
          esac
