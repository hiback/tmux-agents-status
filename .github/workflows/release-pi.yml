name: Release Pi npm adapter

on:
  push:
    tags: ["pi-v*"]

# The proof reads Actions evidence; the called publication workflow narrows the
# OIDC grant to its npm publish job.
permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  main-ci-proof:
    if: github.repository == 'hiback/tmux-agents-status'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-proof.yml
    with:
      sha: ${{ github.sha }}

  release:
    needs: main-ci-proof
    uses: ./.github/workflows/release-npm-adapter.yml
    with:
      sha: ${{ github.sha }}
      adapter: pi
      package: tmux-agents-status-pi
      environment: pi-release
      agent: "@earendil-works/pi-coding-agent"
      model: openai/gpt-5.6-luna
    secrets: inherit
