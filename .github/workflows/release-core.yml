name: Release core

# The core is distributed as this repository's checkout, so publication is a
# GitHub release on a tag. It runs no credentialed real-agent smoke: the
# normalized executable seam makes deterministic verification sufficient for
# core changes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Three lanes of the deterministic suite, every adapter fixture, every package
  # check, and the core release gate on Linux, macOS, and the tmux 3.0 floor.
  deterministic:
    # Forks carry neither the protected environment nor its credentials; the
    # guard keeps a fork's own tag from starting a publication attempt at all.
    if: github.repository == 'hiback/tmux-agents-status'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: deterministic
    runs-on: ubuntu-latest
    # `needs` is what keeps publication unreachable until every gate passes. The
    # environment adds the deployment restriction to this artifact's own tag
    # pattern, which is a GitHub setting rather than a file.
    environment: core-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
