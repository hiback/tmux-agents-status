name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests share a group so obsolete revisions are canceled. Every other
# run gets a unique group, so a later main push can never replace evidence for
# an earlier commit while it is queued or running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  artifact-policy:
    name: artifact-version-policy
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify adapter artifact versions
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release-policy.mjs check-changes --base "$BASE_SHA" --head "$GITHUB_SHA"

  deterministic:
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux-tmux-current
            os: ubuntu-latest
            tmux: current
          - lane: macos-tmux-current
            os: macos-latest
            tmux: current
          # The advertised floor, built from source so it stays executable.
          - lane: linux-tmux-3.1
            os: ubuntu-latest
            tmux: "3.1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-tmux
        with:
          version: ${{ matrix.tmux }}

      - run: npm ci

      - run: npm run typecheck

      # Isolation comes after `npm ci` so installation still uses the runner's
      # own home, while every tmux server, socket, and configuration file the
      # tests create stays out of the runner's shared state.
      - name: Isolate the test environment
        run: |
          mkdir -p "$RUNNER_TEMP/isolated-home" "$RUNNER_TEMP/isolated-tmp"
          {
            echo "HOME=$RUNNER_TEMP/isolated-home"
            echo "TMPDIR=$RUNNER_TEMP/isolated-tmp"
          } >>"$GITHUB_ENV"

      - name: Run the deterministic suite
        run: |
          tmux -V
          npm test

      # Every lane, so the floor lane exercises the config-load path that only a
      # real `~/.tmux.conf` reaches.
      - name: Verify the released core installs and removes cleanly
        run: npm run test:core-release
